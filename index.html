<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shazam Killer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1e1e2e; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .search-btn { background: linear-gradient(135deg, #2481cc, #1b65a1); color: white; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4); transition: 0.2s; }
        .search-btn:active { transform: scale(0.95); }
        .search-btn.recording { background: linear-gradient(135deg, #cc2424, #a11b1b); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 20px; color: #a0a0a0; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎵 Shazam Killer</h1>
    <button class="search-btn" id="searchBtn">🎙 Искать музыку</button>
    <div id="status">Нажми, чтобы записать 5 секунд</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const btn = document.getElementById('searchBtn');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            if (isRecording) return;

            try {
                // Просим доступ к микрофону
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    // Когда запись остановлена, отправляем файл
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    // Меняем интерфейс обратно
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎙 Искать музыку';
                    status.innerText = 'Отправляем боту...';
                    isRecording = false;

                    // Отправляем файл в Telegram
                    const formData = new FormData();
                    formData.append('audio', audioBlob, 'record.webm');
                    
                    // Отправляем данные боту (через WebApp API)
                    tg.sendData(JSON.stringify({ action: "recognize", data: "audio_sent" }));
                    
                    // Примечание: Telegram WebApp пока не умеет напрямую отправлять файлы боту. 
                    // В идеале тут нужно использовать fetch к твоему серверу.
                    // Но для начала мы можем просто показать, что запись прошла.
                    tg.showAlert("Запись сделана! (Нужно настроить сервер для отправки)");
                };

                // Начинаем запись
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerHTML = '🔴 Идет запись (5 сек)...';
                status.innerText = 'Слушаю музыку...';

                // Останавливаем через 5 секунд
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    }
                }, 5000);

            } catch (err) {
                tg.showAlert("Ошибка доступа к микрофону: " + err.message);
            }
        });
    </script>
</body>
</html>
