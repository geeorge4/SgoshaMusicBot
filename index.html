<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shazam Killer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1e1e2e; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .search-btn { background: linear-gradient(135deg, #2481cc, #1b65a1); color: white; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4); transition: 0.2s; }
        .search-btn:active { transform: scale(0.95); }
        .search-btn.recording { background: linear-gradient(135deg, #cc2424, #a11b1b); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 20px; color: #a0a0a0; font-size: 14px; }
        #share-container { margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <h1>🎵 Shazam Killer</h1>
    <button class="search-btn" id="searchBtn">🎙 Искать музыку</button>
    <div id="status">Нажми, чтобы записать 5 секунд</div>

    <!-- Скрытый контейнер для ссылки на файл -->
    <div id="share-container">
        <a id="downloadLink" style="color: #2481cc; text-decoration: underline;" download="audio.webm">Скачать запись</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const btn = document.getElementById('searchBtn');
        const status = document.getElementById('status');
        const shareContainer = document.getElementById('share-container');
        const downloadLink = document.getElementById('downloadLink');

        btn.addEventListener('click', async () => {
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎙 Искать музыку';
                    status.innerText = 'Запись сделана!';
                    isRecording = false;

                    // Создаем ссылку на скачивание файла
                    const url = URL.createObjectURL(audioBlob);
                    downloadLink.href = url;
                    shareContainer.style.display = 'block';

                    // Пытаемся использовать Web Share API (если поддерживается)
                    if (navigator.share) {
                        navigator.share({
                            title: 'Аудио для распознавания',
                            text: 'Отправь это голосовое боту!',
                            files: [new File([audioBlob], 'music.webm', { type: 'audio/webm' })]
                        }).catch(console.error);
                    } else {
                        tg.showAlert("Файл готов. Нажми 'Скачать запись', а затем отправь его боту.");
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerHTML = '🔴 Идет запись (5 сек)...';
                status.innerText = 'Слушаю музыку...';

                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    }
                }, 5000);

            } catch (err) {
                tg.showAlert("Ошибка доступа к микрофону: " + err.message);
            }
        });
    </script>
</body>
</html>
