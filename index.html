<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shazam Killer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #1e1e2e; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
        .search-btn { background: linear-gradient(135deg, #2481cc, #1b65a1); color: white; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(36, 129, 204, 0.4); transition: 0.2s; margin-top: 20px; }
        .search-btn:active { transform: scale(0.95); }
        .search-btn.recording { background: linear-gradient(135deg, #cc2424, #a11b1b); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 20px; color: #a0a0a0; font-size: 14px; }
    </style>
</head>
<body>
    <h1>🎵 Shazam Killer</h1>
    <p>Нажми, чтобы записать 5 секунд музыки</p>
    
    <button class="search-btn" id="searchBtn">🎙 Искать музыку</button>
    <div id="status">Готов к записи...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВСТАВЬ СЮДА СВОЙ ТОКЕН ОТ BOTFATHER
        const BOT_TOKEN = 'ТВОЙ_ТОКЕН_ЗДЕСЬ'; 
        const CHAT_ID = tg.initDataUnsafe?.user?.id; // ID пользователя (тебя)

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        const btn = document.getElementById('searchBtn');
        const status = document.getElementById('status');

        btn.addEventListener('click', async () => {
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    
                    btn.classList.remove('recording');
                    btn.innerHTML = '🎙 Искать музыку';
                    status.innerText = 'Отправляем боту...';
                    isRecording = false;

                    // Отправляем файл через Telegram Bot API
                    try {
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('voice', audioBlob, 'music.webm');
                        formData.append('caption', 'Распознай этот трек!');

                        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, {
                            method: 'POST',
                            body: formData
                        });

                        const result = await response.json();
                        
                        if (result.ok) {
                            status.innerText = 'Файл отправлен боту!';
                            tg.showAlert("Голосовое отправлено! Бот сейчас ответит.");
                        } else {
                            status.innerText = 'Ошибка отправки.';
                            tg.showAlert("Ошибка: " + result.description);
                        }
                    } catch (error) {
                        console.error(error);
                        status.innerText = 'Ошибка сети.';
                        tg.showAlert("Ошибка сети: " + error.message);
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.innerHTML = '🔴 Идет запись (5 сек)...';
                status.innerText = 'Слушаю музыку...';

                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        mediaRecorder.stream.getTracks().forEach(track => track.stop());
                    }
                }, 5000);

            } catch (err) {
                tg.showAlert("Ошибка микрофона: " + err.message);
            }
        });
    </script>
</body>
</html>
